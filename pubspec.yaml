name: meno
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.9.1
  envied: ^1.3.2
  equatable: ^2.0.8
  firebase_core: ^4.6.0
  flutter:
    sdk: flutter
  flutter_background: ^1.3.0+1
  flutter_it: ^2.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_quill: ^11.5.0
  flutter_reaction_button: ^3.0.0+3
  flutter_secure_storage: ^10.0.0
  flutter_staggered_animations: ^1.1.1
  fpdart: ^1.2.0
  go_router: ^17.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  livekit_client: ^2.6.2
  logger: ^2.6.2
  meno_design_system:
    git:
      url: git@github.com:Inklings-Ops/meno_design_system.git
      ref: master
  objectbox: ^5.2.0
  objectbox_flutter_libs: ^5.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  readmore: ^3.0.0
  responsive_framework: ^1.5.1
  scroll_to_index: ^3.0.1
  shared_preferences: ^2.5.4
  skeletonizer: ^2.1.2
  socket_io_client: ^3.1.4
  timeago: ^3.7.1
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.11.0
  envied_generator: ^1.3.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.6.3
  objectbox_generator: ^5.2.0
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/json/kjv.json

  fonts:
    - family: MIcons
      fonts:
        - asset: assets/fonts/MIcons.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  color: "#360090"

  android_12:
    image: assets/images/splash-logo.png
    icon_background_color: "#360090"