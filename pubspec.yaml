name: meno
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  dio: ^5.9.1
  envied: ^1.3.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_it: ^2.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  fpdart: ^1.2.0
  go_router: ^17.1.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  meno_design_system:
    git:
      url: git@github.com:Inklings-Ops/meno_design_system.git
      ref: master
  responsive_framework: ^1.5.1
  skeletonizer: ^2.1.2
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.11.0
  envied_generator: ^1.3.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true

  fonts:
    - family: MIcons
      fonts:
        - asset: assets/fonts/MIcons.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  color: "#360090"

  android_12:
    image: assets/images/splash-logo.png
    icon_background_color: "#360090"