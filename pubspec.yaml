  internet_connection_checker: ^1.0.0+1
  intl: ^0.19.0
  json_annotation: ^4.8.1
  jwt_decoder: ^2.0.1
  livekit_client: ^1.5.6
  logger: ^2.0.2+1
  meno_design_system:
    path: packages/meno_design_system
  objectbox: ^2.5.0
  objectbox_flutter_libs: ^2.5.0
  path: ^1.8.3
  path_provider: ^2.1.2
  permission_handler: ^11.0.1
  pinput: ^3.0.1
  provider: ^6.1.2
  readmore: ^2.2.0
  responsive_framework: ^1.4.0
  retrofit: ^4.0.1
  riverpod_annotation: ^2.1.6
  rxdart: ^0.27.7
  scroll_to_index: ^3.0.1
  shared_preferences: ^2.2.1
  shimmer: ^3.0.0
  skeletonizer: ^1.4.2
  socket_io_client: ^2.0.3
  timeago_flutter: ^3.7.0
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.6
  build_verify: ^3.1.0
  envied_generator:
  flutter_gen_runner: ^5.3.1
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter
  freezed:
  go_router_builder: ^2.7.1
  injectable_generator: ^2.4.0
  json_serializable: ^6.7.1
  matcher: ^0.12.16
  mockito: ^5.4.2
  objectbox_generator: ^2.5.0
  retrofit_generator: ^8.0.4
  riverpod_generator: ^2.3.3
  very_good_analysis: ^6.0.0

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: true

flutter_native_splash:
  color: "#360090"

  android_12:
    image: assets/images/splash-logo.png
    icon_background_color: "#360090"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/json/books.json
    - assets/json/kjv.json
  
  fonts:
    - family: MIcons
      fonts:
        - asset: assets/fonts/MIcons.ttf
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFProDisplay_Thin.ttf
          weight: 100
        - asset: assets/fonts/SFProDisplay_UltraLight.ttf
          weight: 200
        - asset: assets/fonts/SFProDisplay_Light.ttf
          weight: 300
        - asset: assets/fonts/SFProDisplay_Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplay_Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay_SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplay_Bold.ttf
          weight: 700
        - asset: assets/fonts/SFProDisplay_Black.ttf
          weight: 800
        - asset: assets/fonts/SFProDisplay_Heavy.ttf
          weight: 900