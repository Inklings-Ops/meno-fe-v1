name: meno_fe_v1
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  meno_design_system:
    path: packages/meno_design_system
  # flutter_gen: ^5.3.1
  # flutter_svg: ^2.0.7
  flutter_hooks: ^0.20.0
  hooks_riverpod: ^2.3.7
  riverpod_annotation: ^2.1.6
  intl: ^0.18.1
  pinput: ^3.0.1
  injectable: ^2.3.0
  get_it: ^7.6.4
  envied: ^0.5.2
  dartz: ^0.10.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.1
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  retrofit: ^4.0.1
  dio: ^5.3.3
  equatable: ^2.0.5
  http_parser: ^4.0.2
  logger: ^2.0.2+1
  flutter_onboarding_slider: ^1.0.10
  internet_connection_checker: ^1.0.0+1
  shimmer: ^3.0.0

  figma_layout_grid: ^0.3.2
  jwt_decoder: ^2.0.1
  cached_network_image: ^3.3.0
  path: ^1.8.3
  image_picker: ^1.0.4

  socket_io_client: ^2.0.3+1
  livekit_client: ^1.5.2
  permission_handler: ^11.0.1
  go_router: ^12.1.1
  flutter_reaction_button: ^3.0.0+2
  flutter_staggered_animations: ^1.1.1
  flutter_screenutil: ^5.9.0
  flutter_native_splash: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  flutter_gen_runner: ^5.3.1
  freezed:
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.3
  envied_generator:
  retrofit_generator: ^8.0.4
  injectable_generator: ^2.4.0
  mockito: ^5.4.2
  matcher: ^0.12.16
  go_router_builder: ^2.3.3
  build_verify: ^3.1.0

# flutter_gen:
#   output: lib/core/gen/
#   integrations:
#     flutter_svg: true
    # flare_flutter: true
    # rive: true
    # lottie: true

flutter_native_splash:
  color: "#360090"

  android_12:
    image: assets/images/splash-logo.png
    icon_background_color: "#360090"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  
  fonts:
    - family: MIcons
      fonts:
        - asset: assets/fonts/MIcons.ttf
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFProDisplay_Thin.ttf
          weight: 100
        - asset: assets/fonts/SFProDisplay_UltraLight.ttf
          weight: 200
        - asset: assets/fonts/SFProDisplay_Light.ttf
          weight: 300
        - asset: assets/fonts/SFProDisplay_Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplay_Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay_SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplay_Bold.ttf
          weight: 700
        - asset: assets/fonts/SFProDisplay_Black.ttf
          weight: 800
        - asset: assets/fonts/SFProDisplay_Heavy.ttf
          weight: 900