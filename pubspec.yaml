  firebase_messaging: ^14.7.6
  flutter_local_notifications: ^16.2.0
  readmore: ^2.2.0
  flutter_launcher_icons: ^0.13.1
  flutter_bloc: ^8.1.3
  hydrated_bloc: ^9.1.3
  path_provider: ^2.1.2
  fluttertoast: ^8.2.4
  flow_builder: ^0.0.10
  objectbox_flutter_libs: ^2.5.0
