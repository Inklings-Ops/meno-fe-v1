name: meno_fe_v1
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_gen: ^5.3.1
  flutter_hooks: ^0.20.0
  flutter_svg: ^2.0.7
  hooks_riverpod: ^2.3.7
  intl: ^0.18.1

  pinput: ^3.0.1

  widgetbook: ^3.2.0
  widgetbook_annotation: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  flutter_lints: ^2.0.0
  flutter_gen_runner: ^5.3.1

  widgetbook_generator: ^3.1.0

flutter_gen:
  output: lib/core/gen/
  integrations:
    flutter_svg: true
    # flare_flutter: true
    # rive: true
    # lottie: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  
  fonts:
    - family: MIcons
      fonts:
        - asset: assets/fonts/MIcons.ttf
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFProDisplay_Thin.ttf
          weight: 100
        - asset: assets/fonts/SFProDisplay_UltraLight.ttf
          weight: 200
        - asset: assets/fonts/SFProDisplay_Light.ttf
          weight: 300
        - asset: assets/fonts/SFProDisplay_Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplay_Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay_SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplay_Bold.ttf
          weight: 700
        - asset: assets/fonts/SFProDisplay_Black.ttf
          weight: 800
        - asset: assets/fonts/SFProDisplay_Heavy.ttf
          weight: 900