name: meno_design_system
resolution: workspace
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: '^3.9.2'
  flutter: ">=1.17.0"

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_gen: ^5.12.0
  flutter_hooks: ^0.21.3+1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.2
  get_time_ago: ^2.3.2
  intl: ^0.20.2
  pinput: ^5.0.2
  shimmer: ^3.0.0
  skeletonizer: ^2.1.0+1
  vector_graphics: any
dev_dependencies:
  build_runner: ^2.10.1
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter_gen:
  output: lib/src/gen/
  integrations:
    flutter_svg: true
    # flare_flutter: true
    # rive: true
    # lottie: true

  assets:
    enabled: true
    outputs:
      directory_path_enabled: true
      package_parameter_enabled: true
      class_name: Assets

  fonts:
    enabled: true
    outputs:
      directory_path_enabled: true
      package_parameter_enabled: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/json/kjv.json
  
  fonts:
    - family: MIcons
      fonts:
        - asset: assets/fonts/MIcons.ttf
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFProDisplay_Thin.ttf
          weight: 100
        - asset: assets/fonts/SFProDisplay_UltraLight.ttf
          weight: 200
        - asset: assets/fonts/SFProDisplay_Light.ttf
          weight: 300
        - asset: assets/fonts/SFProDisplay_Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplay_Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay_SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplay_Bold.ttf
          weight: 700
        - asset: assets/fonts/SFProDisplay_Black.ttf
          weight: 800
        - asset: assets/fonts/SFProDisplay_Heavy.ttf
          weight: 900